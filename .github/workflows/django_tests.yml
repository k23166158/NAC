name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.12]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python manage.py migrate

    - name: Run Tests
      run: |
        coverage run manage.py test
        coverage report

    - name: Enforce 98% per-file coverage
      run: |
        coverage json
        
        python -c '
        import json
        import sys
        
        with open("coverage.json") as f:
            data = json.load(f)
            
        failed = False
        for filename, info in data["files"].items():
            pct = info["summary"]["percent_covered"]
            if pct < 98:
                print(f"::error file={filename}::Coverage is {pct:.2f}% (minimum 98%)")
                failed = True
                
        if failed:
            sys.exit(1)
        else:
            print("All files meet the 98% minimum coverage threshold.")
        '