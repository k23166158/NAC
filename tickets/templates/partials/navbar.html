<header>
    <nav>
        <ul>
            <li><a href="/">Home</a></li>
                {% if user.is_authenticated %}
        <li>
            <form action="/logout/" method="post" class="logout-form">
                {% csrf_token %}
                <button type="submit" class="logout-btn">Logout</button>
            </form>
        </li>
            {% else %}
                <li><a href="/login/">Login</a></li>
            {% endif %}
        </ul>
    </nav>
</header>
